name: Build distribution packages
run-name: Postika packages ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by make release-all
        default: manual
        type: string

permissions:
  contents: read

jobs:
  packages:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-24.04
          - target: windows-amd64
            runner: windows-2025
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-amd64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev patchelf libfuse2t64
      - name: Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          (Join-Path ${env:ProgramFiles(x86)} 'NSIS') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install pinned Wails CLI
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          CGO_ENABLED=0 GOBIN="$GITHUB_WORKSPACE/.tools/bin" go install "github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION"
          echo "$GITHUB_WORKSPACE/.tools/bin" >> "$GITHUB_PATH"
      - run: npm ci --prefix frontend
      - name: Build frontend and generate Wails bindings
        run: wails3 task common:build:frontend
      - run: npm --prefix frontend run check
      - run: node --test scripts/package-release.test.mjs scripts/release-all.test.mjs scripts/flatten-release.test.mjs
      - run: go test -buildvcs=false -timeout 120s ./...
      - name: Package and stage artifacts
        run: node scripts/package-release.mjs '${{ matrix.target }}'
      - uses: actions/upload-artifact@v6
        with:
          name: postika-${{ matrix.target }}
          path: |
            bin/releases/*/${{ matrix.target }}/*
            !bin/releases/*/${{ matrix.target }}/*.app
            !bin/releases/*/${{ matrix.target }}/*.app/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
