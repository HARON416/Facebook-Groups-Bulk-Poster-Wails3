# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "postika"
arch: ${GOARCH}
platform: "linux"
version: "0.1.14"
section: "default"
priority: "extra"
maintainer: "Postika Technologies <haronkibetrutoh@gmail.com>"
description: "Postika desktop application"
vendor: "Postika Technologies"
homepage: "https://postika.softwrhq.com"
license: "MIT"
release: "1"

contents:
  - src: "./bin/postika-update-admin"
    dst: "/usr/lib/postika/update-admin"
    file_info:
      mode: 0755
  - src: "./build/linux/postika.apparmor"
    dst: "/etc/apparmor.d/postika"
    type: config
    file_info:
      mode: 0644
  - src: "./LICENSE"
    dst: "/usr/share/doc/postika/copyright"
  - src: "./bin/postika"
    dst: "/usr/local/bin/postika"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/postika.png"
  - src: "./build/linux/app.postika.desktop"
    dst: "/usr/share/applications/app.postika.desktop"
    file_info:
      mode: 0644

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - pkexec
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - polkit
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - polkit
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  postremove: "./build/linux/nfpm/scripts/postremove.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# GTK4 / WebKitGTK 6.0 only. No legacy GTK3 build is distributed.
